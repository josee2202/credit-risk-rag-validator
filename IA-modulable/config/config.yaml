ollama:
  host: localhost
  port: 11434
llm:
  embed:
    name: nomic-embed-text
    batch_size: 32        # textos por petición a Ollama; lotes de ~250+ provocan errores en /tokenize
  text:
    name: llama3.2:1b     # etiqueta oficial de Ollama (el desarrollo original usó un alias local del mismo modelo)
    max_tokens: 1024      # límite de tokens generados por respuesta; sin él, el modelo de 1B puede entrar en bucle
qdrant:
  location: http://localhost:6333   # URL del servidor, ":memory:" o ruta local para el modo embebido
